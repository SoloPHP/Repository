name: PHP tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            dbal: '4.3.*'
          - php: '8.3'
            dbal: '^4.3'
          - php: '8.5'
            dbal: '^4.3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, dom, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --with="doctrine/dbal:${{ matrix.dbal }}" --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: php examples/crud.php
      - run: php examples/translations.php
      - run: php examples/relations.php

  database:
    name: ${{ matrix.database.engine }} / PHP ${{ matrix.runtime.php }} / DBAL ${{ matrix.runtime.dbal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.3'
            dbal: '4.3.*'
          - php: '8.3'
            dbal: '^4.3'
          - php: '8.5'
            dbal: '^4.3'
        database:
          - engine: MySQL 8.4
            image: mysql:8.4
            port: 3306
            url: mysql://repository:repository@127.0.0.1:3306/repository_test
            health: mysqladmin ping -h 127.0.0.1 -u root -prepository_root --silent
          - engine: MariaDB 12.3
            image: mariadb:12.3
            port: 3306
            url: mysql://repository:repository@127.0.0.1:3306/repository_test
            health: healthcheck.sh --connect --innodb_initialized
          - engine: PostgreSQL 17
            image: postgres:17
            port: 5432
            url: postgresql://repository:repository@127.0.0.1:5432/repository_test
            health: pg_isready -h 127.0.0.1 -U repository -d repository_test
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_DATABASE: repository_test
          MYSQL_USER: repository
          MYSQL_PASSWORD: repository
          MYSQL_ROOT_PASSWORD: repository_root
          POSTGRES_DB: repository_test
          POSTGRES_USER: repository
          POSTGRES_PASSWORD: repository
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      REPOSITORY_DATABASE_URL: ${{ matrix.database.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.runtime.php }}
          extensions: pdo_mysql, pdo_pgsql, dom, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --with="doctrine/dbal:${{ matrix.runtime.dbal }}" --no-interaction --prefer-dist --no-progress
      - name: Run database integration tests
        run: composer test:database
