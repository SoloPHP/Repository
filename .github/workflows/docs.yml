name: Documentation

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm audit
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'SoloPHP/Repository'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'SoloPHP/Repository'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      # The Pages backend occasionally answers "Deployment failed, try again later";
      # a second identical attempt is enough to get past that.
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
      - uses: actions/deploy-pages@v5
        id: retry
        if: steps.deployment.outcome == 'failure'
